{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">My Transactions</h2>
<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>Time</th>
      <th>Merchant</th>
      <th>Amount</th>
    </tr>
  </thead>
  <tbody>
    {% for t in transactions %}
      <tr>
        <td>{{ t.timestamp }}</td>
        <td>{{ t.merchant }}</td>
        <td>₹{{ t.amount }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="3" class="text-center">No transactions yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
