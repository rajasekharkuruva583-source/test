

{% extends "base.html" %}
{% block content %}
<div class="card shadow">
  <div class="card-header bg-primary text-white">New Transaction</div>
  <div class="card-body">
    <form method="post" class="needs-validation" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success">Submit</button>
    </form>
  </div>
</div>
{% endblock %}
